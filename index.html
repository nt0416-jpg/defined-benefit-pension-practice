<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<title>DB法令・令・則 記入練習</title>
<style>
  :root {
    --ink: #1c1915;
    --muted: #5c564c;
    --line: #d9d2c5;
    --paper: #fffdf8;
    --bg: #efeae1;
    --green: #1f4d3a;
    --green-soft: #e5f0ea;
    --bad: #9c2f2f;
    --bad-bg: #f8e4e4;
    --ok: #1d6b3a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink);
    background: var(--bg);
    font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
    font-size: 15px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 12px 18px;
    background: var(--green);
    color: #f7f4ee;
  }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; }
  header p { margin: 0; font-size: 13px; opacity: 0.9; }
  header button {
    margin-left: auto;
    background: transparent;
    color: inherit;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 48px); }
  aside {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border-right: 1px solid var(--line);
    background: #f7f4ee;
    min-height: 0;
  }
  .kinds { display: flex; gap: 6px; }
  .kinds button { flex: 1; white-space: nowrap; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 4px;
    padding: 5px 10px;
  }
  button[aria-pressed="true"], button.primary {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .check { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #q {
    font: inherit;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    width: 100%;
    background: #fff;
  }
  #list { overflow: auto; min-height: 0; flex: 1; }
  .ch {
    position: sticky;
    top: 0;
    background: #f7f4ee;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 4px 4px;
  }
  .art {
    display: flex;
    gap: 6px;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .art .no { flex: 0 0 auto; color: var(--green); }
  .art .cap { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art.current { background: var(--green-soft); }
  main { overflow: auto; padding: 18px 28px 48px; min-width: 0; }
  #crumb { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
  #title { font-size: 22px; margin: 0 0 4px; }
  #meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .levels, .tools { display: flex; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .tools { gap: 12px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; position: relative; }
  .seg button:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  .seg button[aria-pressed="true"] { z-index: 1; }
  .actions { display: flex; gap: 8px; }
  #grade, #reset {
    height: 40px;
    padding: 0 16px;
    border-radius: 999px;
    box-shadow: none;
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
  }
  #grade {
    background: var(--green-soft);
    color: var(--green);
    border: 1px solid transparent;
  }
  #reset {
    margin-left: 0;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  #grade:hover { background: color-mix(in srgb, var(--green) 8%, var(--green-soft)); }
  #reset:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
  #grade:focus-visible, #reset:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  #grade:active {
    background: color-mix(in srgb, var(--green) 10%, var(--green-soft));
    border-radius: 8px;
  }
  #reset:active {
    background: color-mix(in srgb, var(--ink) 10%, transparent);
    border-radius: 8px;
  }
  #status { min-height: 1.4em; color: var(--muted); font-size: 13px; }
  .sheet {
    white-space: pre-wrap;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px 20px;
    font-family: "Yu Mincho", "Yu Gothic", serif;
    font-size: 17px;
    line-height: 2.05;
  }
  .hole {
    display: inline;
    font: inherit;
    line-height: inherit;
    color: inherit;
    background: #fff8e6;
    border-bottom: 1.5px solid var(--green);
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    padding: 0 1px;
    caret-color: var(--ink);
  }
  .hole .vis {
    font: inherit;
    line-height: 1.25;
    color: inherit;
    caret-color: var(--ink);
    outline: none;
  }
  .hole .pad {
    color: transparent;
    -webkit-text-fill-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .hole.good { background: var(--green-soft); border-bottom-color: var(--ok); }
  .hole.bad { background: var(--bad-bg); border-bottom-color: var(--bad); }
  .key { border-bottom: 1.5px solid var(--green); }
  .egov-cap { font-weight: 700; margin: 0 0 2px; }
  .egov-no { font-weight: 700; }
  #misses { margin-top: 14px; font-size: 14px; }
  #misses .row { margin: 8px 0; white-space: pre-wrap; }
  #misses .ok { color: var(--ok); font-weight: 700; }
  #misses .ng { color: var(--bad); font-weight: 700; }
  .miss { background: var(--bad-bg); }
  .extra { background: #f8ecd4; }
  .label { color: var(--muted); }
  .nav button { padding: 2px 8px; }
  #menu, #navclose, #backdrop { display: none; }
  @media (max-width: 800px) {
    header {
      gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    }
    header p { display: none; }
    header h1 { font-size: 16px; flex: 1; }
    #menu { display: inline-block; margin-left: 0; min-height: 40px; }
    header button { min-height: 40px; }
    .app { display: block; height: auto; min-height: calc(100dvh - 52px); }
    aside {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(100%, 420px);
      transform: translateX(-105%);
      transition: transform .18s ease;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    #navclose { display: block; align-self: flex-start; min-height: 40px; }
    body.nav-open { overflow: hidden; }
    body.nav-open aside { transform: none; box-shadow: 8px 0 24px rgba(28, 25, 21, .2); }
    #backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 25;
      border: 0;
      padding: 0;
      background: rgba(28, 25, 21, .35);
    }
    body.nav-open #backdrop { display: block; }
    main {
      padding: 12px 14px max(28px, env(safe-area-inset-bottom));
    }
    #title { font-size: 20px; }
    .levels button, .tools button { min-height: 44px; padding: 8px 10px; }
    #q, .hole { font-size: 16px; }
    .sheet { font-size: 16px; padding: 12px 12px 16px; }
    .art { min-height: 44px; padding: 8px 6px; }
  }
  @media print {
    header, aside, .levels, .tools, #status, .nav { display: none !important; }
    .app { display: block; height: auto; }
    main { overflow: visible; }
    .hole { color: transparent; }
  }
</style>
</head>
<body>
<header>
  <h1>DB法令・令・則 記入練習</h1>
  <p>条文の形のまま、隠す範囲を四段階で切り替える。</p>
  <button type="button" id="menu" aria-expanded="false">条</button>
</header>
<div class="app">
  <aside>
    <button type="button" id="navclose">閉じる</button>
    <div class="kinds" id="kinds"></div>
    <label class="check"><input type="checkbox" id="suppl"> 附則も表示</label>
    <input id="q" type="search" placeholder="条番号・見出し・語句" autocomplete="off">
    <div id="list"></div>
  </aside>
  <button type="button" id="backdrop" aria-label="条一覧を閉じる"></button>
  <main>
    <p id="crumb"></p>
    <h2 id="title"></h2>
    <p id="meta"></p>
    <div class="levels seg" id="levels" role="group" aria-label="空欄の範囲">
      <button type="button" data-level="core">穴埋め1</button>
      <button type="button" data-level="more">穴埋め2</button>
      <button type="button" data-level="subject">穴埋め3</button>
      <button type="button" data-level="full">全文</button>
    </div>
    <div class="tools">
      <div class="modes seg" role="group" aria-label="画面">
        <button type="button" id="inputMode" aria-pressed="true">入力</button>
        <button type="button" id="reveal" aria-pressed="false">答え</button>
      </div>
      <div class="actions">
        <button type="button" id="grade">採点</button>
        <button type="button" id="reset">入力クリア</button>
      </div>
      <span id="score"></span>
    </div>
    <p id="status"></p>
    <div id="work"></div>
    <div id="misses"></div>
  </main>
</div>

caption": "解散存続厚生年金基金の残余財産の確定給付企業年金への交付", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "施行日以後に解散した存続厚生年金基金（当該解散した日における年金給付等積立金の額が責任準備金相当額を下回るものを除く。）は、規約で定めるところにより、その設立事業所（政令で定める場合にあっては、設立事業所の一部。以下この項及び次条において同じ。）が確定給付企業年金の実施事業所（改正後確定給付企業年金法第四条第一号に規定する実施事業所をいう。以下この項において同じ。）となっている場合又は実施事業所となる場合であって、当該確定給付企業年金の規約において、あらかじめ、当該存続厚生年金基金から前条第四項の規定により当該設立事業所に使用される解散基金加入員等（解散した厚生年金基金がその解散した日において年金たる給付の支給に関する義務を負っていた者をいう。以下同じ。）に分配すべき残余財産（以下この条において「残余財産」という。）の交付を受けることができる旨が定められているときは、当該確定給付企業年金の事業主等（改正後確定給付企業年金法第二十九条第一項に規定する事業主等をいう。以下同じ。）に残余財産の当該確定給付企業年金の資産管理運用機関等（改正後確定給付企業年金法第三十条第三項に規定する資産管理運用機関等をいう。以下同じ。）への交付を申し出ることができる。\n２ 当該確定給付企業年金の事業主等は、当該確定給付企業年金の資産管理運用機関等が前項の規定による申出に従い残余財産の交付を受けたときは、当該交付金を原資として、規約で定めるところにより、当該解散基金加入員等に対し、改正後確定給付企業年金法第二十九条第一項各号及び第二項各号に掲げる給付（以下「老齢給付金等」という。）の支給を行うものとする。\n３ 当該確定給付企業年金の資産管理運用機関等が第一項の規定による申出に従い残余財産の交付を受けたときは、前条第四項の規定の適用については、当該残余財産は、当該解散基金加入員等に分配されたものとみなす。\n４ 当該確定給付企業年金の事業主等は、第二項の規定により老齢給付金等の支給を行うこととなったときは、その旨を当該解散基金加入員等に通知しなければならない。\n５ 当該確定給付企業年金の事業主等は、解散基金加入員等の所在が明らかでないため前項の規定による通知をすることができないときは、当該通知に代えて、その通知すべき事項を公告しなければならない。", "parent": "", "core": null, "more": null, "subject": [[0, 58], [62, 74], [75, 96], [97, 105], [106, 121], [124, 170], [171, 182], [183, 208], [209, 226], [227, 232], [233, 325], [326, 330], [331, 361], [370, 388], [389, 437], [438, 442], [443, 507], [508, 512], [526, 529], [543, 549], [550, 598], [599, 610], [611, 623], [624, 637], [638, 687], [688, 700], [714, 753], [754, 770], [771, 778], [779, 801], [815, 821], [822, 852], [853, 879], [893, 899], [900, 943], [944, 952], [953, 974]], "full": [[0, 530], [533, 701], [704, 802], [805, 880], [883, 975]]}, {"article": "36", "label": "第三十六条", "caption": "解散存続厚生年金基金の残余財産の独立行政法人勤労者退職金共済機構への交付", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "施行日以後に解散した存続厚生年金基金（当該解散した日における年金給付等積立金の額が責任準備金相当額を下回るものを除く。）は、規約で定めるところにより、その設立事業所の事業主（当該事業主が中小企業退職金共済法（昭和三十四年法律第百六十号）第二条第一項に規定する中小企業者である場合に限る。以下この条において同じ。）がその雇用する解散基金加入員（解散した厚生年金基金がその解散した日において老齢年金給付の支給に関する義務を負っていた者をいう。以下同じ。）を中小企業退職金共済法第二条第七項に規定する被共済者として同条第三項に規定する退職金共済契約（以下この条において単に「退職金共済契約」という。）を締結した場合には、附則第三十四条第四項の規定により当該退職金共済契約の被共済者となった解散基金加入員に分配すべき残余財産（以下この条において「残余財産」という。）のうち被共済者持分額（当該残余財産のうち、当該被共済者となった解散基金加入員の持分として厚生労働省令で定める方法により算定した額をいう。）の範囲内の額の交付を独立行政法人勤労者退職金共済機構（以下この条において「機構」という。）に申し出ることができる。 この場合において、同項中「残余財産」とあるのは、「残余財産（附則第三十六条第一項の規定による申出に従い交付されたものを除く。）」とする。\n２ 機構が前項の規定による申出に従い残余財産のうち被共済者持分額の範囲内の額の交付を受けた場合において、当該交付された額（以下この条において「交付額」という。）のうち、当該退職金共済契約の効力が生じた日における掛金月額その他の事情を勘案して政令で定める額については、厚生労働省令で定めるところにより、政令で定める月数を当該退職金共済契約の被共済者に係る掛金納付月数（掛金の納付があった月数をいう。次項において同じ。）に通算するものとする。 この場合において、その通算すべき月数は、当該退職金共済契約の被共済者が存続厚生年金基金の加入員であった期間の月数を超えることができない。\n３ 交付額から前項の政令で定める額を控除した残余の額を有する当該退職金共済契約の被共済者が退職したときにおける退職金の額は、中小企業退職金共済法第十条第一項ただし書及び第二項の規定にかかわらず、次の各号に掲げる前項の規定による通算後の掛金納付月数の区分に応じ、当該各号に定める額とする。\n  一 十一月以下 当該交付のあった日の属する月の翌月から当該被共済者が退職した日の属する月までの期間につき、当該残余の額に対し、政令で定める利率に厚生労働大臣が定める利率を加えた利率の複利による計算をして得た元利合計額（当該交付のあった日の属する月に当該被共済者が退職したときは、当該残余の額。次号において「計算後残余額」という。）\n  二 十二月以上 中小企業退職金共済法第十条第二項の規定により算定した額に計算後残余額を加算した額\n４ 前項の残余の額を有する当該退職金共済契約の被共済者に係る当該退職金共済契約が解除されたときにおける解約手当金の額は、中小企業退職金共済法第十六条第三項の規定にかかわらず、前項の規定の例により計算して得た額とする。\n５ 第一項の規定による申出に従い交付額が機構に交付された退職金共済契約の被共済者については、当該事業主は、中小企業退職金共済法第二十七条第一項の規定にかかわらず、同項の申出をすることができない。\n６ 第一項の規定による申出に従い交付額が機構に交付されたときは、当該事業主は、その旨を当該交付額に係る被共済者となった当該解散基金加入員に通知しなければならない。\n７ 第一項の規定は、施行日以後に解散した存続厚生年金基金の設立事業所の事業主がその雇用する解散基金加入員を被共済者とする退職金共済契約を当該解散する前から引き続き締結している場合について準用する。 この場合において、同項中「被共済者となった」とあるのは、「被共済者である」と読み替えるものとするほか、必要な技術的読替えは、政令で定める。\n８ 前項において準用する第一項の規定による申出に従い交付額が機構に交付された退職金共済契約の被共済者が退職したときにおける退職金の額は、中小企業退職金共済法の規定にかかわらず、同項の規定による交付額の交付がなかったものとみなして同法の規定により算定した退職金額に、当該交付のあった日の属する月の翌月から当該被共済者が退職した日の属する月までの期間につき、当該交付額に対し、政令で定める利率に厚生労働大臣が定める利率を加えた利率の複利による計算をして得た元利合計額（当該交付のあった日の属する月に当該被共済者が退職したときは、当該交付額）を加算した額とする。\n９ 第七項において準用する第一項の規定による申出に従い交付額が機構に交付された退職金共済契約が解除されたときにおける解約手当金の額は、中小企業退職金共済法の規定にかかわらず、前項の規定の例により計算して得た額とする。\n１０ 第六項の規定は、第七項の場合について準用する。 この場合において、第六項中「被共済者となった」とあるのは、「被共済者である」と読み替えるものとするほか、必要な技術的読替えは、政令で \n２ 存続連合会は、前項に規定する業務のほか、次に掲げる業務を行うことができる。\n  一 附則第四十四条第二項の規定により同条第一項に規定する残余財産の移換を受け、同条第三項の規定により同条第一項に規定する解散基金加入員等又はその遺族について存続連合会障害給付金又は存続連合会遺族給付金の支給を行うこと。\n  二 附則第四十五条第二項の規定により同条第一項に規定する残余財産の移換を受け、同条第三項又は第五項の規定により同条第一項に規定する解散基金加入員等又はその遺族について存続連合会遺族給付金の支給を行うこと。\n  三 附則第五十三条第四項若しくは第六項、第五十四条第二項、第五十五条第二項又は第五十六条第二項の規定により年金給付等積立金又は積立金の移換を行うこと。\n  四 附則第四十八条第二項の規定により同条第一項に規定する残余財産の移換を受け、同条第三項の規定により同条第一項に規定する終了制度加入者等又はその遺族について存続連合会障害給付金又は存続連合会遺族給付金の支給を行うこと。\n  五 附則第四十九条第二項の規定により同条第一項に規定する残余財産の移換を受け、同条第三項又は第五項の規定により同条第一項に規定する終了制度加入者等又はその遺族について存続連合会遺族給付金の支給を行うこと。\n  六 附則第三十八条第三項の規定により読み替えて適用する確定拠出年金法第五十四条の五第二項の規定により同項に規定する個人別管理資産の移換を受け、附則第四十九条の二第一項の規定により同項に規定する企業型年金加入者であった者又はその遺族について存続連合会老齢給付金又は存続連合会遺族給付金の支給を行うこと。\n  七 附則第五十七条第二項、第五十八条第二項又は第五十九条第二項の規定により積立金の移換を行うこと。\n３ 存続連合会は、前二項に規定する業務のほか、次に掲げる業務を行うものとする。\n  一 附則第六十一条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十条第五項の規定により老齢年金給付の支給に関する義務を承継している基金中途脱退者について老齢年金給付の支給を行い、及び附則第六十一条第二項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十条の二第三項の規定により基金中途脱退者に係る老齢年金給付の額を加算し、又は死亡一時金その他の一時金たる給付の支給を行うこと。\n  二 附則第六十一条第三項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十一条第二項又は第五項の規定により解散基金加入員に対する老齢年金給付の支給又は解散基金加入員に係る老齢年金給付の額の加算若しくは死亡一時金その他の一時金たる給付の支給を行い、及び附則第六十一条第四項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十二条第二項の規定により解散基金加入員等について死亡又は障害を支給理由とする年金たる給付又は一時金たる給付の支給を行うこと。\n  三 附則第六十二条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十五条第四項若しくは第六項、附則第六十二条第二項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十五条の二第二項又は附則第六十二条第三項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十五条の三第二項の規定により年金給付等積立金の移換を行うこと。\n  四 附則第六十三条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第九十一条の二第三項の規定により確定給付企業年金中途脱退者又はその遺族について同項の老齢給付金又は遺族給付金の支給を行うこと。\n  五 附則第六十三条第二項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第九十一条の三第三項の規定により同条第一項に規定する終了制度加入者等又はその遺族について同条第三項の老齢給付金又は遺族給付金の支給を行うこと。\n  六 附則第六十三条第三項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第九十一条の四第三項の規定により同条第一項に規定する終了制度加入者等又はその遺族について同条第三項の障害給付金又は遺族給付金の支給を行うこと。\n  七 附則第六十三条第四項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第九十一条の五第三項又は第五項の規定により同条第一項に規定する終了制度加入者等又はその遺族について同条第三項の遺族給付金又は同条第五項の遺族給付金の支給を行うこと。\n  八 附則第六十四条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十五条の四第二項、附則第六十四条第二項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十五条の五第二項又は附則第六十四条第三項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十七条の三第二項の規定により積立金の移換を行うこと。\n４ 存続連合会は、次に掲げる事業を行うことができる。 ただし、第一号又は第二号に掲げる事業を行う場合には、厚生労働大臣の認可を受けなければならない。\n  一 厚生年金基金の拠出金等を原資として行う次に掲げる事業\n    イ 解散基金加入員に支給する老齢年金給付（附則第六十一条第三項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十一条第二項の老齢年金給付をいう。以下このイにおいて同じ。）又は存続連合会老齢給付金につき一定額が確保されるよう、老齢年金給付又は存続連合会老齢給付金の額を付加する事業\n    ロ 存続厚生年金基金に対し、附則第五条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十一条第二項の承認若しくは附則第五条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十二条第一項の認可を受けるために要する費用又は附則第五条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百四十四条の五第一項の規定による年金給付等積立金の一部の移換若しくは同条第四項の規定による残余財産の全部若しくは一部の移換に要する費用を助成する事業\n    ハ 存続厚生年金基金が支給する老齢年金給付等につき一定額が確保されるよう、存続厚生年金基金の年金給付等積立金の額を付加する事業\n  二 事業主等が支給する老齢給付金等につき一定額が確保されるよう、事業主等の拠出金等を原資として、事業主等の積立金（改正後確定給付企業年金法第五十九条に規定する積立金をいう。）の額を付加する事業\n  三 会員の行う事業の健全な発展を図るために必要な事業であって政令で定めるもの\n５ 存続連合会は、厚生年金基金の加入員及び加入員であった者並びに確定給付企業年金その他附則第三十八条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百五十八条の五第二号に規定する年金制度の加入者及び加入者であった者（以下この項において「厚生年金基金の加入員等」という。）の福祉を増進するため、規約で定めるところにより、厚生年金基金の加入員等の福利及び厚生に関する事業を行うことができる。\n６ 存続連合会は、附則第五条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百三十条第五項の規定による委託を受けて、存続厚生年金基金の業務の一部を行うことができる。\n７ 存続連合会は、附則第三十八条第三項の規定により読み替えて適用する改正後確定給付企業年金法第九十三条の規定による委託を受けて、事業主等の業務の一部を行うことができる。\n８ 存続連合会は、附則第三十八条第三項の規定により読み替えて適用する確定拠出年金法第四十八条の二（同法第七十三条において準用する場合を含む。）の規定による委託を受けて、情報収集等業務（同法第四十八条の二に規定する情報収集等業務をいう。次条第三号において同じ。）及び資料提供等業務（同法第四十八条の二に規定する資料提供等業務をいう。次条第三号において同じ。）を行うことができる。\n９ 存続連合会は、その業務の一部を、政令で定めるところにより、信託会社（信託業法（平成十六年法律第百五十四号）第三条又は第五十三条第一項の免許を受けたものに限る。）、信託業務を営む金融機関、生命保険会社（附則第百三十一条の規定による改正後の保険業法第二条第三項に規定する生命保険会社及び同条第八項に規定する外国生命保険会社等をいう。）、農業協同組合連合会（全国を地区とし、農業協同組合法（昭和二十二年法律第百三十二号）第十条第一項第十号の事業のうち生命共済の事業を行うものに限る。）その他の法人に委託することができる。", "parent": "", "core": null, "more": null, "subject": [[7, 22], [28, 114], [115, 131], [132, 168], [169, 176], [177, 270], [279, 334], [335, 339], [340, 389], [390, 420], [421, 436], [437, 441], [442, 460], [461, 465], [466, 475], [481, 517], [518, 576], [582, 640], [641, 657], [6 れた改正前厚生年金保険法第四十四条の二第一項の規定は、当該存続連合会がその代行給付支給義務を負っていた年金たる給付の額の計算の基礎となる厚生年金基金の加入員であった期間（他の存続厚生年金基金がその支給に関する義務を承継している年金たる給付の額の計算の基礎となる加入員であった期間を除く。）については、適用しない。\n４ 存続連合会が第一項の規定により代行給付支給義務を免れた老齢年金給付支給対象者が老齢厚生年金の受給権者であるときは、附則第八十六条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第四十四条の二第一項の規定にかかわらず、当該老齢厚生年金の額は当該代行給付支給義務に係る年金たる給付の額の計算の基礎となる厚生年金基金の加入員であった期間（他の存続厚生年金基金がその支給に関する義務を承継している年金たる給付の額の計算の基礎となる加入員であった期間を除く。）が厚生年金基金の加入員であった期間でないものとして同項の規定の例により計算した額とするものとし、当該存続連合会が第一項の認可を受けた日の属する月の翌月から、当該老齢厚生年金の額を改定する。", "parent": "", "core": null, "more": null, "subject": [[7, 19], [20, 43], [44, 57], [58, 225], [226, 309], [318, 321], [330, 380], [381, 388], [399, 435], [436, 446], [457, 501], [517, 559], [560, 616], [617, 732], [740, 745], [758, 805], [806, 867], [868, 983], [986, 1032], [1033, 1062], [1063, 1078]], "full": [[0, 389], [392, 447], [450, 746], [749, 1079]]}, {"article": "66", "label": "第六十六条", "caption": "老齢年金給付支給対象者に係る責任準備金相当額の徴収", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "政府は、前条第一項の認可があったときは、当該認可により存続連合会が代行給付支給義務を免れた老齢年金給付支給対象者に係る責任準備金相当額を当該存続連合会から徴収する。", "parent": "", "core": null, "more": null, "subject": [[4, 19], [20, 81]], "full": [[0, 82]]}, {"article": "67", "label": "第六十七条", "caption": "老齢年金給付支給対象者に係る責任準備金相当額の一部の物納", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "前条の規定により政府が存続連合会から責任準備金相当額を徴収する場合においては、存続連合会を解散厚生年金基金等（改正前確定給付企業年金法第百十三条第一項に規定する解散厚生年金基金等をいう。以下同じ。）とみなして、改正前確定給付企業年金法第百十四条の規定の例による。 この場合において、同条第二項中「第百十一条第二項の厚生労働大臣の承認又は第百十二条第一項」とあるのは、「公的年金制度の健全性及び信頼性の確保のための厚生年金保険法等の一部を改正する法律（平成二十五年法律第六十三号）附則第六十五条第一項」と読み替えるものとするほか、必要な技術的読替えは、政令で定める。\n２ 前項の規定により存続連合会が改正前確定給付企業年金法第百十四条の規定の例により物納をする場合においては、存続連合会を解散厚生年金基金等とみなして、改正前保険業法附則第一条の十三の規定の例による。 この場合において、必要な技術的読替えは、政令で定める。", "parent": "", "core": null, "more": null, "subject": [[2, 38], [39, 92], [93, 97], [98, 104], [105, 130], [133, 140], [141, 182], [183, 263], [264, 274], [275, 281], [287, 336], [337, 357], [358, 381], [384, 391], [392, 402], [403, 409]], "full": [[0, 282], [285, 410]]}, {"article": "68", "label": "第六十八条", "caption": "審査請求及び再審査請求に関する経過措置", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "改正前厚生年金保険法の規定により設立された企業年金連合会が行った処分又は賦課に関する改正前厚生年金保険法第百六十九条において準用する改正前厚生年金保険法第九十条第一項及び第二項又は第九十一条の規定による審査請求又は再審査請求で施行日の前日までに裁決が行われていないものについては、なお従前の例による。", "parent": "", "core": null, "more": null, "subject": [[10, 139], [140, 149]], "full": [[0, 150]]}, {"article": "69", "label": "第六十九条", "caption": "存続連合会への事務委託", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "厚生年金保険の実施者たる政府は、附則第八条の規定により政府が当該存続厚生年金基金から責任準備金相当額を徴収する場合、附則第十一条第七項の規定により政府が当該自主解散型基金から減額責任準備金相当額を徴収する場合、附則第十三条第一項の規定により政府が当該自主解散型基金から年金給付等積立金の額を、その設立事業所の事業主から責任準備金相当額から当該年金給付等積立金の額を控除した額をそれぞれ徴収する場合、附則第二十条第三項の規定により政府が当該清算型基金から減額責任準備金相当額を徴収する場合、附則第二十二条第一項の規定により政府が当該清算型基金から年金給付等積立金の額を、その設立事業所の事業主から責任準備金相当額から当該年金給付等積立金の額を控除した額をそれぞれ徴収する場合及び附則第三十一条第一項の規定により政府が当該清算未了特定基金の設立事業所の事業主から附則第三十条第四項第一号に掲げる額を徴収する場合において、これらの徴収のために必要な事務及び厚生年金保険の実施者たる政府が支給する年金たる給付に係る事務のうち、政令で定めるものを存続連合会に行わせることができる。\n２ 厚生年金保険の実施者たる政府は、附則第五条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十三条第一項の規定に基づき、解散厚生年金基金等から責任準備金相当額を徴収する場合（附則第五条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法附則第三十二条第三項の規定により同条第一項の認可を受けた存続厚生年金基金が解散（附則第五条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十一条第三項の規定による解散に限る。）に必要な行為又は企業年金基金（改正後確定給付企業年金法第二条第四項に規定する企業年金基金をいう。）となるために必要な行為をする場合を含む。）において、当該徴収のために必要な事務及び厚生年金保険の実施者たる政府が支給する年金たる給付に係る事務のうち、政令で定めるものを存続連合会に行わせることができる。", "parent": "", "core": null, "more": null, "subject": [[6, 15], [16, 57], [58, 104], [105, 145], [146, 198], [199, 243], [244, 283], [284, 407], [408, 458], [459, 484], [494, 503], [504, 561], [562, 730], [731, 779], [780, 800], [811, 855], [856, 881]], "full": [[0, 485], [488, 882]]}, {"article": "70", "label": "第七十条", "caption": "存続連合会の解散等", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "存続連合会は、連合会の成立の時において、解散する。\n２ 存続連合会は、前項の規定により解散したときは、基金中途脱退者及び解散基金加入員等（以下この条、次条第二項並びに附則第七十五条及び第七十八条第一項第二号において「基金中途脱退者等」という。）に係る年金たる給付及び一時金たる給付の支給に関する義務を免れる。 ただし、当該解散した日までに支給すべきであった年金たる給付若しくは一時金たる給付でまだ支給していないものの支給又は附則第五十三条第四項若しくは第六項、第五十四条第二項、第五十五条第二項、第五十六条第二項、第五十七条第二項、第五十八条第二項若しくは第五十九条第二項の規定により当該解散した日までに移換すべきであった年金給付等積立金若しくは積立金でまだ移換していないものの移換に関する義務については、この限りでない。\n３ 存続連合会は、第一項の規定により解散したときは、規約で定めるところにより、当該存続連合会の残余財産（附則第四十条第一項第一号及び第二号、第二項第一号及び第二号並びに第三項第一号及び第二号の規定により行う業務に係るものに限る。第五項及び附則第七十五条において同じ。）を基金中途脱退者等に分配しなければならない。\n４ 存続連合会が第一項の規定により解散したときは、第二項ただし書に規定する義務及び前項の規定により基金中途脱退者等に分配する義務を除き、その一切の権利及び義務は、その時において連合会が承継する。\n５ 附則第三十八条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百六十八条第三項において準用する改正前厚生年金保険法第百四十六条の二の規定によりなお存続するものとみなされた存続連合会は、第三項の規定による残余財産の分配に関する事務を連合会に委託することができる。\n６ 第四項の規定により連合会が権利を承継する場合における当該承継に伴う登記又は登録については、当該承継の日から一年以内に登記又は登録を受けるものに限り、登録免許税を課さない。\n７ 第四項の規定により連合会が権利を承継する場合における当該承継に係る不動産の取得に対しては、不動産取得税を課することができない。", "parent": "", "core": null, "more": null, "subject": [[7, 19], [20, 24], [35, 50], [51, 74], [75, 120], [121, 153], [162, 229], [230, 238], [239, 247], [248, 256], [257, 265], [266, 352], [353, 360], [371, 387], [388, 400], [401, 431], [432, 475], [476, 494], [495, 517], [530, 543], [544, 586], [587, 599], [600, 615], [629, 722], [723, 760], [767, 808], [809, 837], [838, 848], [855, 896], [897, 914]], "full": [[0, 25], [28, 361], [364, 518], [521, 616], [619, 761], [764, 849], [852, 915]]}, {"article": "71", "label": "第七十一条", "caption": "", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "厚生労働大臣は、前条第一項の規定にかかわらず、存続連合会が次の各号のいずれかに該当するときは、存続連合会の解散を命ずることができる。\n  一 存続連合会が附則第三十八条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百七十九条第一項の規定による命令に違反したとき。\n  二 その事業の状況によりその事業の継続が困難であると認めるとき。\n２ 存続連合会は、前項の規定により解散したときは、基金中途脱退者等、確定給付企業年金中途脱退者、改正後確定給付企業年金法第八十九条第六項に規定する終了制度加入者等及び企業型年金加入者であった者に係る年金たる給付及び一時金たる給付の支給に関する義務を免れる。 ただし、当該解散した日までに支給すべきであった年金たる給付若しくは一時金たる給付でまだ支給していないものの支給又は附則第五十三条第四項若しくは第六項、第五十四条第二項、第五十五条第二項、第五十六条第二項、第五十七条第二項、第五十八条第二項若しくは第五十九条第二項の規定により当該解散した日までに移換すべきであった年金給付等積立金若しくは積立金でまだ移換していないものの移換に関する義務については、この限りでない。", "parent": "", "core": null, "more": null, "subject": [[8, 22], 中途脱退者等に分配すべき残余財産の交付を連合会に申し出ることができる。\n２ 連合会は、前項に規定する残余財産の交付を受けたときは、当該交付金を原資として、政令で定めるところにより、当該基金中途脱退者等に対し、老齢を支給理由とする年金たる給付又は一時金たる給付の支給を行うものとする。\n３ 連合会が第一項に規定する残余財産の交付を受けたときは、附則第七十条第三項の規定の適用については、当該残余財産は、当該基金中途脱退者等に分配されたものとみなす。\n４ 連合会は、第二項の規定により年金たる給付又は一時金たる給付の支給を行うこととなったときは、その旨を基金中途脱退者等に通知しなければならない。\n５ 連合会は、基金中途脱退者等の所在が明らかでないため前項の規定による通知をすることができないときは、当該通知に代えて、その通知すべき事項を公告しなければならない。", "parent": "", "core": null, "more": null, "subject": [[9, 25], [26, 38], [39, 86], [95, 116], [117, 128], [129, 141], [142, 155], [156, 192], [212, 222], [223, 243], [244, 251], [252, 274], [283, 322], [323, 347], [356, 399], [400, 408], [409, 430]], "full": [[0, 87], [90, 193], [196, 275], [278, 348], [351, 431]]}, {"article": "76", "label": "第七十六条", "caption": "裁定", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "連合会が支給する前条第二項の年金たる給付及び一時金たる給付を受ける権利は、その権利を有する者の請求に基づいて、連合会が裁定する。\n２ 連合会は、前項の規定による裁定に基づき、その請求をした者に前条第二項の年金たる給付又は一時金たる給付の支給を行う。", "parent": "", "core": null, "more": null, "subject": [[13, 36], [37, 54], [55, 63], [72, 86], [87, 123]], "full": [[0, 64], [67, 124]]}, {"article": "77", "label": "第七十七条", "caption": "準用規定", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "改正後確定給付企業年金法第三十一条、第三十三条、第三十四条第一項、第三十五条、第三十六条第一項及び第二項（第二号を除く。）、第三十七条、第三十八条並びに第四十条の規定は、連合会が支給する附則第七十五条第二項の年金たる給付又は一時金たる給付について準用する。 この場合において、必要な技術的読替えは、政令で定める。", "parent": "", "core": null, "more": null, "subject": [[0, 17], [18, 23], [24, 32], [33, 38], [39, 59], [68, 84], [85, 127], [130, 137], [138, 148], [149, 155]], "full": [[0, 156]]}, {"article": "78", "label": "第七十八条", "caption": "連合会の業務の特例", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "連合会は、改正後確定給付企業年金法の規定による業務のほか、次に掲げる業務を行うことができる。\n  一 附則第七十条第五項の規定による委託を受けて、同条第三項に規定する残余財産の分配を行うこと。\n  二 附則第七十五条第一項に規定する残余財産の交付を受け、当該残余財産に係る基金中途脱退者等について同条第二項の規定により年金たる給付又は一時金たる給付の支給を行うこと。\n２ 連合会は、厚生労働大臣の認可を受けて、厚生年金基金の拠出金等を原資として、次に掲げる事業を行うことができる。\n  一 解散基金加入員に支給する附則第七十五条第二項の年金たる給付又は一時金たる給付につき一定額が確保されるよう、当該年金たる給付又は一時金たる給付の額を付加する事業\n  二 存続厚生年金基金に対し、附則第五条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十一条第二項の承認若しくは附則第五条第一項の規定によりなおその効力を有するものとされた改正前確定給付企業年金法第百十二条第一項の認可を受けるために要する費用又は附則第五条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百四十四条の五第一項の規定による年金給付等積立金の一部の移換若しくは同条第四項の規定による残余財産の全部若しくは一部の移換に要する費用を助成する事業\n  三 存続厚生年金基金が支給する老齢年金給付等につき一定額が確保されるよう、存続厚生年金基金の年金給付等積立金の額を付加する事業\n３ 連合会は、附則第五条第一項の規定によりなおその効力を有するものとされた改正前厚生年金保険法第百三十条第五項の規定による委託を受けて、存続厚生年金基金の業務の一部を行うことができる。", "parent": "", "core": null, "more": null, "subject": [[5, 28], [29, 45], [51, 72], [73, 95], [101, 126], [127, 182], [191, 204], [205, 222], [223, 239], [253, 297], [298, 324], [337, 340], [341, 580], [594, 619], [620, 646], [654, 714], [715, 738]], "full": [[0, 46], [51, 96], [101, 183], [186, 240], [245, 324], [329, 580], [585, 646], [649, 739]]}, {"article": "79", "label": "第七十九条", "caption": "区分経理", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "連合会は、前条の規定により行う業務に係る経理については、その他の経理と区分して整理しなければならない。", "parent": "", "core": null, "more": null, "subject": [[5, 27], [28, 50]], "full": [[0, 51]]}, {"article": "80", "label": "第八十条", "caption": "連合会への事務委託", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "厚生年金保険の実施者たる政府は、附則第六十九条に規定する政令で定める事務を連合会に行わせることができる。", "parent": "", "core": null, "more": null, "subject": [[6, 15], [16, 51]], "full": [[0, 52]]}, {"article": "81", "label": "第八十一条", "caption": "確定給付企業年金法の適用", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "連合会が附則第七十八条又は前条の規定による業務を行う場合においては、改正後確定給付企業年金法第百二十一条中「この法律」とあるのは、「この法律又は公的年金制度の健全性及び信頼性の確保のための厚生年金保険法等の一部を改正する法律（平成二十五年法律第六十三号）」とするほか、改正後確定給付企業年金法の規定の適用に関し必要な読替えその他必要な事項は、政令で定める。", "parent": "", "core": null, "more": null, "subject": [[15, 33], [34, 64], [65, 133], [134, 170], [171, 177]], "full": [[0, 178]]}, {"article": "83", "label": "第八十三条", "caption": "徴収金等の帰属する会計", "division": "附　則（平成二五年六月二六日法律第六三号）", "chapter": "", "section": "", "text": "改正後特別会計法附則第二十八条の三第一項及び第二項の規定によるほか、前条第一項各号 業年金の開始", "section": "", "text": "法第三条第一項第一号の規定による確定給付企業年金に係る規約（以下「規約」という。）の承認の申請は、申請書に、次に掲げる書類を添付して、厚生労働大臣（当該規約の承認に関する権限が第百二十一条の規定により地方厚生局長又は地方厚生支局長（以下「地方厚生局長等」という。）に委任されている場合にあっては、地方厚生局長等）に提出することによって行うものとする。\n  一 承認を受けようとする規約\n  二 法第三条第一項の同意を得たことを証する書類\n  三 給付の設計の基礎を示した書類（規約に基づく確定給付企業年金の給付（以下「給付」という。）の設計の基礎を示した書類をいう。以下同じ。）及び掛金の計算の基礎を示した書類（確定給付企業年金を実施しようとする場合における当該確定給付企業年金の掛金の額の計算の基礎を示した書類をいう。以下同じ。）\n  四 資産管理運用契約（法第六十五条第三項に規定する資産管理運用契約をいう。以下同じ。）に関する書類\n  五 確定給付企業年金を実施しようとする厚生年金適用事業所（以下「実施予定事業所」という。）において労働協約等を定めている場合にあっては、当該労働協約等\n  六 実施予定事業所に使用される厚生年金保険の被保険者が加入者となることについて一定の資格を定める場合にあっては、当該事業所において実施されている企業年金制度等（法第五条第一項第二号に規定する企業年金制度等をいう。以下同じ。）が適用される者の範囲についての書類\n  七 前各号に掲げるもののほか、承認に当たって必要な書類\n２ 前項の場合において、当該確定給付企業年金に加入者が存在しないときは、同項第五号及び第六号に掲げる書類を添付することを要しない。\n３ 第一項の場合において、生命保険の契約にあっては、当該確定給付企業年金の毎事業年度の末日における当該契約に係る保険業法施行規則（平成八年大蔵省令第五号）第十条第三号に規定する契約者価額が、生命共済の契約にあっては、当該確定給付企業年金の毎事業年度の末日における当該契約に係る農業協同組合法施行規則（平成十七年農林水産省令第二十七号）第十一条第一項第三号ハに規定する契約者価額（以下「契約者価額」という。）が、数理債務の額（給付に要する費用の通常の予測に基づく予想額（以下「通常予測給付額」という。）の現価に相当する額から標準掛金額の予想額の現価に相当する額を控除した額をいう。以下同じ。）（当該額の計算については、当該契約者価額の計算に用いる予定利率及び予定死亡率を用いるものとする。）を下回らないことが確実に見込まれるもの（以下「受託保証型確定給付企業年金」という。）であって、加入者又は加入者であった者が存在しないもの（以下「閉鎖型受託保証型確定給付企業年金」という。）については、第一項第三号、第五号及び第六号に掲げる書類（給付の設計の基礎を示した書類を除く。）を添付することを要しない。\n４ 第一項の申請は、二以上の実施予定事業所の事業主が一の確定給付企業年金を実施しようとする場合にあっては、その一を代表として定め、その代表が行うものとする。\n５ 前項の場合にあっては、厚生労働大臣は、その申請をした代表に対し法第五条第二項の通知を行うものとする。", "parent": "3", "core": [[223, 237], [291, 305], [813, 818], [908, 913], [917, 922], [1035, 1040], [1092, 1105], [1141, 1157], [1191, 1205]], "more": [[223, 237], [291, 305], [813, 818], [908, 913], [917, 922], [1035, 1040], [1092, 1105], [1141, 1157], [1191, 1205], [1291, 1296]], "subject": [[0, 39], [49, 53], [54, 66], [67, 130], [139, 147], [148, 174], [180, 192], [197, 218], [223, 265], [266, 282], [283, 287], [288, 359], [360, 364], [365, 366], [371, 405], [406, 410], [411, 418], [423, 464], [473, 488], [489, 496], [509, 554], [555, 604], [605, 609], [612, 628], [633, 645], [646, 658], [ 等に関する権限が附則第十一条の規定により地方厚生局長等に委任されている場合にあっては、地方厚生局長等）に提出することによって行うものとする。\n  一 権利義務の移転に係る適格退職年金契約（法人税法（昭和四十年法律第三十四号）附則第二十条第三項に規定する適格退職年金契約をいう。以下同じ。）を締結している事業主の名称\n  二 権利義務の承継に係る規約型企業年金の事業主の名称及び規約番号（基金型企業年金の場合にあっては基金の名称及び基金番号とし、確定給付企業年金がまだ実施されていない場合にあっては規約番号及び基金番号を除く。）\n  三 承継する権利義務の限度\n２ 前項の申請書には、確定給付企業年金が規約型企業年金である場合にあっては法附則第二十五条第二項の規定により準用する法第七十四条第二項の同意を得たことを証する書類、確定給付企業年金がまだ実施されていない場合にあっては令附則第三条第一項及び第二項の規定により準用する令第五十三条第二項又は第五項の同意を得たことを証する書類を添付しなければならない。\n３ 権利義務の承継に伴い、当該権利義務を承継しようとする事業主等が実施する確定給付企業年金の規約の変更の承認等を申請する場合にあっては、当該申請は、当該権利義務の承継の承認等の申請と同時に行わなければならない。\n４ 第二条及び第三条の規定は、令附則第三条第一項及び第二項において準用する令第五十三条第二項又は第五項の同意を得る場合について準用する。", "parent": "", "core": null, "more": null, "subject": [[11, 57], [58, 127], [128, 154], [160, 222], [223, 227], [228, 242], [247, 306], [307, 346], [347, 348], [353, 364], [376, 446], [447, 537], [545, 551], [552, 606], [607, 612], [613, 643], [660, 712]], "full": [[0, 155], [160, 242], [247, 348], [353, 364], [367, 538], [541, 644], [647, 713]]}, {"article": "7", "label": "第七条", "caption": "適格退職年金から移行した場合の財政計算", "division": "附　則", "chapter": "", "section": "", "text": "法附則第二十五条第一項の規定に基づき移行適格退職年金受益者等に係る給付の支給に関する権利義務を承継しようとする厚生年金適用事業所の事業主であって規約型企業年金を実施しようとするもの及び当該権利義務を承継する基金を設立しようとする事業主は、当該権利義務を承継することとなる日（以下この条において「承継日」という。）前一年以内のいずれかの日又は当該権利義務の承継に係る適格退職年金契約における事業年度の末日（承継日前一年六月以内の日に限る。）を計算基準日として、掛金の額の算定を行うものとする。\n２ 法附則第二十五条第一項の規定に基づき移行適格退職年金受益者等に係る給付の支給に関する権利義務を承継しようとする場合であって、当該確定給付企業年金の掛金の額を変更する必要があるときは、当該確定給付企業年金の事業主等は、承継日前一年以内のいずれかの日又は当該確定給付企業年金の事業年度の末日若しくは当該権利義務の移転に係る適格退職年金契約における事業年度の末日（承継日前一年六月以内の日に限る。）を計算基準日として、掛金の額の算定を行うものとする。\n３ 前二項の掛金の額は、第二十四条の三第一号に規定する財政計算を行って算定するものとする。", "parent": "", "core": null, "more": null, "subject": [[11, 118], [119, 154], [155, 217], [218, 228], [229, 244], [259, 309], [310, 338], [339, 355], [356, 442], [443, 453], [454, 469], [483, 515]], "full": [[0, 245], [248, 470], [473, 516]]}, {"article": "8", "label": "第八条", "caption": "適格退職年金から移行した確定給付企業年金の掛金の額の算定に関する経過措置", "division": "附　則", "chapter": "", "sectio ", "chapter": "", "section": "", "text": "法第百四条第一項の規定により、法附則第二十五条第一項に規定する権限（給付の支給に関する権利義務の承継後の確定給付企業年金が簡易な基準に基づく確定給付企業年金である場合に限る。）は、地方厚生局長に委任する。\n２ 第百二十一条第二項の規定は、前項の権限の委任について準用する。", "parent": "104", "core": null, "more": null, "subject": [[0, 14], [15, 86], [90, 101], [119, 135]], "full": [[0, 102], [105, 136]]}, {"article": "12", "label": "第十二条", "caption": "厚生年金基金に係る適格退職年金の権利義務の承継の認可の申請", "division": "附　則", "chapter": "", "section": "", "text": "法附則第二十六条第一項の規定に基づく移行適格退職年金受益者等に係る給付の支給に関する権利義務の承継の認可の申請は、次に掲げる事項を記載した申請書を厚生労働大臣に提出することによって行うものとする。\n  一 権利義務の移転に係る適格退職年金契約を締結している事業主の名称\n  二 権利義務の承継に係る厚生年金基金の名称\n  三 承継する権利義務の限度\n２ 権利義務の承継に係る厚生年金基金がまだ設立されていない場合にあっては、前項の申請書に、令附則第八条の規定により準用する令第五十三条第二項の同意を得たことを証する書類を添付しなければならない。\n３ 権利義務の承継に伴い、当該権利義務を承継しようとする厚生年金基金の規約の変更の認可を申請する場合にあっては、当該申請は、当該権利義務の承継の認可の申請と同時に行わなければならない。\n４ 第二条及び第三条の規定は、令附則第八条において準用する令第五十三条第二項の同意を得る場合について準用する。", "parent": "", "core": null, "more": null, "subject": [[11, 56], [57, 97], [103, 134], [139, 158], [163, 174], [181, 211], [212, 219], [220, 271], [279, 285], [286, 328], [329, 334], [335, 364], [381, 420]], "full": [[0, 98], [103, 134], [139, 158], [163, 174], [177, 272], [275, 365], [368, 421]]}, {"article": "13", "label": "第十三条", "caption": "適格退職年金契約の全部又は一部を解除したことにより事業主に返還される金額を事業主が掛金として払い込む場合の特例", "division": "附　則", "chapter": "", "section": "", "text": "事業主が法人税法施行令（昭和四十年政令第九十七号）附則第十六条第一項第九号ロの規定に基づき適格退職年金契約の全部又は一部を解除したことにより返還される金額を当該事業主が確定給付企業年金の加入者となった同項第二号に規定する受益者等の過去勤務債務の額に係る掛金として特別掛金額を払い込む場合にあっては、第四十六条の規定にかかわらず、直ちに一括して払い込むものとする。", "parent": "", "core": null, "more": null, "subject": [[8, 148], [149, 163], [164, 180]], "full": [[0, 181]]}, {"article": "14", "label": "第十四条", "caption": "掛金の引上げの猶予", "division": "附　則", "chapter": "", "section": "", "text": "次の各号のいずれにも該当する場合には、第四十三条第一項の規定にかかわらず、財政再計算の結果に基づいて掛金の額を算定することとなる日（以下この条において「適用日」という。）から起算して一年以内の期間に算定することとなる同項に規定する掛金の額は、前回の財政計算において計算した掛金の額以上、当該財政再計算において計算した掛金の額以下の範囲内において規約で定める額とすることができる。\n  一 適用日が令和三年四月一日から令和四年三月三十一日までの間に到来すること。\n  二 当該財政再計算において計算した掛金の額が前回の財政計算において計算した掛金の額を上回ること。\n  三 実施事業所の経営の状況が悪化したことにより事業主が掛金を拠出することに支障があると見込まれること。\n２ 前項の規定の適用を受けようとする事業主等は、規約において、当該規定の適用を受ける旨を定めなければならない。", "parent": "", "core": null, "more": null, "subject": [[4, 18], [19, 36], [37, 83], [95, 120], [121, 142], [143, 188], [198, 229], [252, 280], [298, 334], [340, 359], [360, 366], [367, 390]], "full": [[0, 189], [194, 230], [235, 281], [286, 335], [338, 391]]}, {"article": "15", "label": "第十五条", "caption": "", "division": "附　則", "chapter": "", "section": "", "text": "第五十八条第一項（同条第二項において準用する場合を含む。）の規定に基づき規約で定める額を掛金の額に追加して拠出することとなる事業年度の初日が令和三年四月一日から令和四年三月三十一日までの間に到来する場合であって、実施事業所の経営の状況が悪化したことにより事業主が掛金を拠出することに支障があると見込まれるときには、第五十九条第一項の規定にかかわらず、同項の規定に基づき拠出する掛金の額は、当該規約で定める額以下の範囲内において規約で定める額とすることができる。\n２ 前項の規定の適用を受けようとする事業主等は、規約において、当該規定の適用を受ける旨を定めなければならない。", "parent": "", "core": null, "more": null, "subject": [[0, 27], [46, 105], [106, 156], [157, 174], [175, 193], [194, 229], [235, 254], [255, 261], [262, 285]], "full": [[0, 230], [233, 286]]}, {"article": "16", "label": "第十六条", "caption": "過去勤務債務の額の特例", "division": "附　則", "chapter": "", "section": "", "text": "令和二年三月三十一日から令和四年三月三十一日までの間の日を計算基準日として法第六十二条の規定に基づき掛金の額の再計算をする場合には、第四十六条第一項の規定にかかわらず、同項に規定する過去勤務債務の額から、第五十六条各号のいずれかの額の全部又は一部を控除することができる。\n２ 前項の規定の適用を受けようとする事業主等は、規約において、当該規定の適用を受ける旨を定めなければならない。", "parent": "62", "core": null, "more": null, "subject": [[8, 65], [66, 83], [84, 101], [102, 134], [140, 159], [160, 166], [167, 190]], "full": [[0, 135], [138, 191]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（平成一六年九月一七日厚生労働省令第一三一号）", "chapter": "", "section": "", "text": "この省令は、国民年金法等の一部を改正する法律第一条第一号に掲げる規定の施行の日（平成十七年四月一日）から施行する。", "parent": "", "core": null, "more": null, "subject": [[6, 56]], "full": [[0, 57]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（平成一七年三月七日厚生労働省令第二五号）", "chapter": "", "section": "", "text": "この省令は、不動産登記法の施行の日（平成十七年三月七日）から施行する。", "parent": "", "core": null, "more": null, "subject": [[6, 34]], "full": [[0, 35]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（平成一七年五月一九日厚生労働省令第九七号）", "chapter": "", "section": "", "text": "この省令は、国民年金法等の一部を改正する法律（以下「平成十六年改正法」という。）附則第一条第二号の施行の日（平成十七年十月一日）から施行する。", "parent": "", "core": null, "more": null, "subject": [[6, 38], [39, 70]], "full": [[0, 71]]}, {"article": "3", "label": "第三条", "caption": "施行日前に厚生年金基金連合会に移換された積立金に関する経過措置", "division": "附　則（平成一七年五月一九日厚生労働省令第九七号）", "chapter": "", "section": "", "text": "施行日前に、平成十六年改正政令第一条の規定による改正前の厚生年金基金令（以下「旧令」という。）附則第九条第二項の規定により読み替えて適用する旧法第百六十条の二第二項又は旧令附則第十条第二項の規定により読み替えて適用する旧法第百六十二条の三第五項の規定により厚生年金基金連合会に脱退一時金相当額又は残余財産が交付された者（以下この条において「既交付者」という。）が、平成十六年改正法第三十七条の規定による改正後の確定給付企業年金法（平成十三年法律第五十号。以下この条において「新法」という。）第百十五条の四第一項の規定による申出をした場合にあっては、当該交付された脱退一時金相当額又は残余財産に係る積立金（以下単に「積立金」という。）に係る平成十六年改正政令第三条の規定による改正後の確定給付企業年金法施行令（平成十三年政令第四百二十四号。以下この条において「新施行令」という。）第八十八条の三第二項第二号に掲げる同条第一項第二号及び第四条の規定による改正後の確定給付企業年金法施行規則（以下この条において「新確定給付企業年金法施行規則」という。）第百三十八条第一項第三号の規定の適用については、新施行令第八十八条の三第二項第二号に掲げる同条第一項第二号中「法第九十一条の二第二項の規定により連合会に移換された脱退一時金相当額の算定の基礎となった期間又は法第九十一条の三第一項の」とあり、及び新確定給付企業年金法施行規則第百三十八条第一項第三号中「第百四条の三第二号に掲げる脱退一時金相当額の算定の基礎となった期間又は第百四条の六第一項第二号に掲げる」とあるのは、「厚生年金基金令等の一部を改正する政令（平成十六年政令第三百八十三号）第一条の規定による改正前の厚生年金基金令（以下この号において「旧令」という。）附則第九条第二項の規定により読み替えて適用する国民年金法等の一部を改正する法律（平成十六年法律第百四号）第九条の規定による改正前の厚生年金保険法（以下この号において「旧法」という。）第百六十条の二第二項の規定により旧法第百四十九条第一項の厚生年金基金連合会に脱退一時金相当額を交付した確定給付企業年金又は旧令附則第十条第二項の規定により読み替えて適用する旧法第百六十二条の三第四項の」と読み替えるものとする。\n２ 既交付者が新法第百十五条の五第一項の規定による申出をした場合にあっては、積立金に係る新施行令第八十八条の三第一項第二号及び新確定給付企業年金法施行規則第百三十九条第一項第三号の規定の適用については、新施行令第八十八条の三第一項第二号中「法第九十一条の二第二項の規定により連合会に移換された脱退一時金相当額の算定の基礎となった期間又は法第九十一条の三第一項の終了した確定給付企業年金の加入者期間」とあり、及び新確定給付企業年金法施行規則第百三十九条第一項第三号中「算定基礎期間等」とあるのは、「厚生年金基金令等の一部を改正する政令（平成十六年政令第三百八十三号）第一条の規定による改正前の厚生年金基金令（以下この号において「旧令」という。）附則第九条第二項の規定により読み替えて適用する国民年金法等の一部を改正する法律（平成十六年法律第百四号）第九条の規定による改正前の厚生年金保険法（以下この号において「旧法」という。）第百六十条の二第二項の規定により旧法第百四十九条第一項の厚生年金基金連合会に脱退一時金相当額を交付した確定給付企業年金又は旧令附則第十条第二項の規定により読み替えて適用する旧法第百六十二条の三第四項の終了した確定給付企業年金の加入者期間」と読み替えるものとする。\n３ 既交付者が新法第百十七条の三第一項の ject": [[6, 21]], "full": [[0, 22]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（平成二一年一二月二八日厚生労働省令第一六七号）", "chapter": "", "section": "", "text": "この省令は、平成二十二年一月一日から施行する。", "parent": "", "core": null, "more": null, "subject": [[6, 22]], "full": [[0, 23]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（平成二四年一月三一日厚生労働省令第一三号）", "chapter": "", "section": "", "text": "この省令は、公布の日から施行し、確定給付企業年金法施行規則第五十八条、第六十三条及び附則第二条の改正規定並びに附則第四条は、事業年度の末日が平成二十四年四月一日以後の決算から適用する。", "parent": "", "core": null, "more": null, "subject": [[6, 15], [16, 34], [35, 61], [62, 91]], "full": [[0, 92]]}, {"article": "2", "label": "第二条", "caption": "検討", "division": "附　則（平成二四年一月三一日厚生労働省令第一三号）", "chapter": "", "section": "", "text": "厚生労働大臣は、この省令の施行後一年を経過した場合において、この省令による改正後の規定の施行の状況、確定給付企業年金制度を取り巻く社会経済情勢の変化等を勘案し、附則第四条及びこの省令による改正後の確定給付企業年金法施行規則（以下「新規則」という。）附則第二条の規定について検討を加え、必要があると認めるときは、その結果に基づいて必要な措置を講ずるものとする。", "parent": "", "core": null, "more": null, "subject": [[8, 29], [30, 49], [50, 79], [80, 122], [129, 141], [142, 154], [155, 178]], "full": [[0, 179]]}, {"article": "3", "label": "第三条", "caption": "代表事業主による申請手続きに係る経過措置", "division": "附　則（平成二四年一月三一日厚生労働省令第一三号）", "chapter": "", "section": "", "text": "二以上の実施予定事業所（新規則第四条第一項第五号に規定する実施予定事業所をいう。）又は実施事業所（新規則第五条第一号に規定する実施事業所をいう。）の事業主が一の確定給付企業年金を実施しようとする場合にあっては、この省令の施行の日から起算して一年を経過する日までの間は、新規則第四条第四項及び第八条第二項（新規則第九条第二項、第九十条第二項、第九十一条第二項、第九十四条第七項、第九十五条第六項、第九十六条第五項、第九十七条第二項、第百二十三条第七項、第百二十四条第六項、第百二十五条の二第七項及び第百二十六条第六項において準用する場合を含む。）の規定は、適用しないことができる。", "parent": "", "core": null, "more": null, "subject": [[0, 39], [40, 71], [79, 104], [105, 133], [134, 161], [162, 169], [170, 178], [179, 187], [188, 196], [197, 205], [206, 214], [215, 224], [225, 234], [235, 270], [277, 288]], "full": [[0, 289]]}, {"article": "4", "label": "第四条", "caption": "回復計画に係る経過措置", "division": "附　則（平成二四年一月三一日厚生労働省令第一三号）", "chapter": "", "section": "", "text": "当分の間、各事業年度の決算における法第六十三条の厚生労働省令で定めるところにより算定した額は、確定給付企業年金法施行規則第五十八条の規定にかかわらず、当該事業年度の翌々 ion": "附　則（令和三年九月二七日厚生労働省令第一五九号）", "chapter": "", "section": "", "text": "この省令は、令和四年四月一日から施行する。 ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n  一 第一条、第三条、第五条及び第六条の規定 令和四年五月一日", "parent": "", "core": null, "more": null, "subject": [[6, 20], [27, 37], [38, 53], [59, 62], [63, 66], [67, 87]], "full": [[0, 54], [59, 87]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（令和四年一月二一日厚生労働省令第一三号）", "chapter": "", "section": "", "text": "この省令は、令和六年十二月一日から施行する。 ただし、次の各号に掲げる規定は、当該各号に定める日から施行する。\n  一 略\n  二 附則第四条の規定 公布の日", "parent": "", "core": null, "more": null, "subject": [[6, 21], [28, 38], [39, 54], [60, 61], [66, 79]], "full": [[0, 55], [60, 61], [66, 79]]}, {"article": "4", "label": "第四条", "caption": "他制度掛金相当額を規約に定める場合の特例", "division": "附　則（令和四年一月二一日厚生労働省令第一三号）", "chapter": "", "section": "", "text": "施行日前に、改正政令第一条の規定による改正後の確定拠出年金法施行令第十一条第二号に規定する他制度掛金相当額に関する事項を、財政再計算（確定給付企業年金法第五十八条第一項若しくは第二項又は第六十二条の規定に基づく掛金の額の再計算をいう。）を行うことなく同法第三条第一項に規定する規約に定める場合の当該規約の変更は、確定給付企業年金法施行規則第七条第一項の規定にかかわらず、同条第二項に規定する同法第七条第二項ただし書の厚生労働省令で定める特に軽微な変更とする。", "parent": "58", "core": null, "more": null, "subject": [[0, 5], [6, 60], [61, 116], [125, 155], [156, 184], [185, 228]], "full": [[0, 229]]}, {"article": "1", "label": "第一条", "caption": "施行期日", "division": "附　則（令和七年五月三〇日厚生労働省令第六二号）", "chapter": "", "section": "", "text": "この省令は、刑法等の一部を改正する法律の施行の日（令和七年六月一日）から施行する。", "parent": "", "core": null, "more": null, "subject": [[6, 40]], "full": [[0, 41]]}, {"article": "3", "label": "第三条", "caption": "経過措置", "division": "附　則（令和七年五月三〇日厚生労働省令第六二号）", "chapter": "", "section": "", "text": "この省令の施行の際現にあるこの省令による改正前の様式（次項において「旧様式」という。）により使用されている書類は、この省令による改正後の様式によるものとみなす。\n２ この省令の施行の際現にある旧様式による用紙については、当分の間、これを取り繕って使用することができる。", "parent": "", "core": null, "more": null, "subject": [[0, 41], [50, 56], [57, 79], [87, 109], [110, 114], [115, 133]], "full": [[0, 80], [83, 134]]}]}]}</script>
<script>
"use strict";

const STORE = "db-fill-level-v2";
const data = JSON.parse(document.getElementById("law-data").textContent);
const laws = data.laws;
const LEVELS = ["core", "more", "subject", "full"];

const els = {
  kinds: document.getElementById("kinds"),
  suppl: document.getElementById("suppl"),
  q: document.getElementById("q"),
  list: document.getElementById("list"),
  crumb: document.getElementById("crumb"),
  title: document.getElementById("title"),
  meta: document.getElementById("meta"),
  status: document.getElementById("status"),
  work: document.getElementById("work"),
  misses: document.getElementById("misses"),
  score: document.getElementById("score"),
};

const state = { kind: "法", level: "core", article: null, law: null, fields: [], answer: false };

function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch { return {}; }
}
function saveStore(patch) {
  localStorage.setItem(STORE, JSON.stringify(Object.assign(loadStore(), patch)));
}
function articleKey(law, article) {
  return law.kind + "\t" + article.division + "\t" + article.article;
}
function canon(s) {
  let out = "";
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (c === 0x3000 || c === 0xfeff || /\s/u.test(ch)) continue;
    if (c >= 0xff01 && c <= 0xff5e) out += String.fromCodePoint(c - 0xfee0);
    else if (ch === "〜") out += "～";
    else out += ch;
  }
  return out;
}
function visibleArticles() {
  const law = laws.find(l => l.kind === state.kind);
  const q = els.q.value.trim();
  const qNorm = canon(q);
  return law.articles.filter(a => {
    if (!els.suppl.checked && a.division !== "本則") return false;
    if (!q) return true;
    if (canon(a.label).includes(qNorm) || canon(a.caption).includes(qNorm)) return true;
    const asNum = canon(q).replace(/第/g, "").replace(/条/g, "").replace(/の/g, "-");
    if (/^\d+(?:-\d+)?$/.test(asNum) && a.article === asNum) return true;
    if (qNorm.length >= 2 && canon(a.text).includes(qNorm)) return true;
    return false;
  });
}
function renderKinds() {
  els.kinds.replaceChildren();
  for (const law of laws) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = law.kind;
    b.title = law.name;
    b.setAttribute("aria-pressed", law.kind === state.kind ? "true" : "false");
    b.addEventListener("click", () => {
      state.kind = law.kind;
      const list = visibleArticles();
      openArticle(law, list[0] || law.articles.find(a => a.division === "本則") || law.articles[0], { keepNav: true });
    });
    els.kinds.append(b);
  }
}
function renderList() {
  const items = visibleArticles();
  const law = laws.find(l => l.kind === state.kind);
  els.list.replaceChildren();
  if (!items.length) {
    const p = document.createElement("p");
    p.className = "check";
    p.textContent = "該当する条がありません。";
    els.list.append(p);
    return;
  }
  let chapter = null;
  let division = null;
  for (const a of items) {
    if (els.suppl.checked && a.division !== division) {
      division = a.division;
      chapter = null;
      const h = document.createElement("div");
      h.className = "ch";
      h.textContent = a.division;
      els.list.append(h);
    }
    if (a.chapter !== chapter) {
      chapter = a.chapter;
      const h = document.createElement("div");
      h.className = "ch";
      h.textContent = a.chapter || "（章なし）";
      els.list.append(h);
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "art";
    if (state.article && articleKey(law, a) === articleKey(state.law, state.article)) btn.classList.add("current");
    const no = document.createElement("span");
    no.className = "no";
    no.textContent = a.label;
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = a.caption || "";
    btn.append(no, cap);
    btn.addEventListener("click", () => openArticle(law, a));
    els.list.append(btn);
  }
}
function levelRanges(article) {
  return article[state.level];
}
function renderLevels() {
  document.querySelectorAll("#levels button").forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.level === state.level ? "true" : "false");
  });
}
function openArticle(law, article, options) {
  saveDraft();
  state.law = law;
  state.article = article;
  state.kind = law.kind;
  els.score.textContent = "";
  els.misses.replaceChildren();
  const place = [article.chapter, article.section].filter(Boolean).join(" / ");
  els.crumb.replaceChildren(document.createTextNode(law.name + (place ? " / " + place : "")));
  const nav = document.createElement("span");
  nav.className = "nav";
  for (const [dir, label] of [[-1, "前の条"], [1, "次の条"]]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", () => stepArticle(dir));
    nav.append(b, document.createTextNode(" "));
  }
  els.crumb.append(nav);
  els.title.hidden = false;
  els.title.textContent = article.label + (article.caption ? "　" + article.caption : "");
  els.meta.textContent = [law.abbrev, article.division === "本則" ? "" : article.division, law.amended ? "最終改正 " + law.amended : ""].filter(Boolean).join(" / ");
  renderKinds();
  renderList();
  renderLevels();
  renderWork();
  saveStore({
    last: {
      key: articleKey(law, article),
      kind: state.kind,
      level: state.level,
      suppl: els.suppl.checked,
    },
  });
  const current = els.list.querySelector(".art.current");
  if (current) {
    const top = current.getBoundingClientRect().top - els.list.getBoundingClientRect().top + els.list.scrollTop;
    els.list.scrollTop = Math.max(0, top - 48);
  }
}
function closeNav() {
  document.body.classList.remove("nav-open");
  document.getElementById("menu").setAttribute("aria-expanded", "false");
}
function openNav() {
  document.body.classList.add("nav-open");
  document.getElementById("menu").setAttribute("aria-expanded", "true");
  els.q.focus();
}
function stepArticle(dir) {
  const items = visibleArticles();
  const law = laws.find(l => l.kind === state.kind);
  const key = articleKey(state.law, state.article);
  const i = items.findIndex(a => articleKey(law, a) === key);
  if (items[i + dir]) openArticle(law, items[i + dir]);
}
function draftSlot() {
  return articleKey(state.law, state.article) + "|" + state.level;
}
function readDraft() {
  try {
    const all = JSON.parse(sessionStorage.getItem(STORE) || "{}");
    return all[draftSlot()] || null;
  } catch { return null; }
}
let draftTimer = 0;
function scheduleDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraft, 300);
}
function saveDraft() {
  if (!state.article || !state.fields.length) return;
  const all = JSON.parse(sessionStorage.getItem(STORE) || "{}");
  all[draftSlot()] = state.fields.map(f => holeTyped(f.el));
  const keys = Object.keys(all);
  while (keys.length > 30) delete all[keys.shift()];
  sessionStorage.setItem(STORE, JSON.stringify(all));
}
function syncTools() {
  document.getElementById("inputMode").setAttribute("aria-pressed", state.answer ? "false" : "true");
  document.getElementById("reveal").setAttribute("aria-pressed", state.answer ? "true" : "false");
}
function appendStatute(sheet, mode) {
  const text = state.article.text;
  const ranges = levelRanges(state.article);
  appendEgovHead(sheet, state.article);
  if (ranges == null) {
    sheet.append(document.createTextNode(text));
    return null;
  }
  let cursor = 0;
  ranges.forEach(([a, b]) => {
    if (a > cursor) sheet.append(document.createTextNode(text.slice(cursor, a)));
    const answer = text.slice(a, b);
    if (mode === "input") {
      const input = makeHole(answer);
      state.fields.push({ el: input, answer });
      sheet.append(input);
    } else {
      const shown = document.createElement("span");
      shown.className = "key";
      shown.textContent = answer;
      sheet.append(shown);
    }
    cursor = b;
  });
  if (cursor < text.length) sheet.append(document.createTextNode(text.slice(cursor)));
  return ranges;
}
function renderWork() {
  state.answer = false;
  syncTools();
  els.work.replaceChildren();
  els.misses.replaceChildren();
  state.fields = [];
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  const ranges = appendStatute(sheet, "input");
  els.work.append(sheet);
  if (ranges == null) {
    const name = state.level === "core" ? "穴埋め1" : "穴埋め2";
    els.status.textContent = "この条の" + name + "は、まだ作っていません。穴埋め3と全文は使えます。";
    return;
  }
  const saved = readDraft();
  if (saved) state.fields.forEach((f, i) => { if (saved[i] != null) setHoleTyped(f.el, saved[i]); });
  els.status.textContent = ranges.length ? "" : "この段階で隠す語はありません。";
}
function holeTyped(el) {
  const vis = el.querySelector(".vis");
  return vis ? (vis.textContent || "").replace(/\u200b/g, "") : "";
}
function restAnswer(answer, typed) {
  return Array.from(answer).slice(Array.from(typed).length).join("");
}
function setHoleTyped(el, value) {
  el.querySelector(".vis").textContent = value || "\u200b";
  el.querySelector(".pad").textContent = restAnswer(el.dataset.answer || "", value);
}
function placeVisCaret(vis, atEnd) {
  const node = vis.firstChild;
  const sel = window.getSelection();
  if (!node || !sel) return;
  const range = document.createRange();
  range.setStart(node, atEnd ? node.textContent.length : 0);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}
function settleVis(vis) {
  const raw = vis.textContent || "";
  const typed = raw.replace(/\u200b/g, "");
  if (!typed) {
    if (raw !== "\u200b") {
      vis.textContent = "\u200b";
      if (document.activeElement === vis) placeVisCaret(vis, false);
    }
    return;
  }
  if (!raw.includes("\u200b")) return;
  vis.textContent = typed;
  if (document.activeElement === vis) placeVisCaret(vis, true);
}
function makeHole(answer) {
  const el = document.createElement("span");
  el.className = "hole";
  el.dataset.answer = answer;
  const vis = document.createElement("span");
  vis.className = "vis";
  vis.contentEditable = "plaintext-only";
  vis.spellcheck = false;
  vis.setAttribute("role", "textbox");
  vis.setAttribute("aria-label", "空欄");
  const pad = document.createElement("span");
  pad.className = "pad";
  pad.setAttribute("aria-hidden", "true");
  el.append(vis, pad);
  setHoleTyped(el, "");
  let composing = false;
  vis.addEventListener("compositionstart", () => { composing = true; });
  vis.addEventListener("compositionend", () => {
    composing = false;
    settleVis(vis);
    pad.textContent = restAnswer(answer, holeTyped(el));
    scheduleDraft();
  });
  vis.addEventListener("input", () => {
    if (!composing) settleVis(vis);
    pad.textContent = restAnswer(answer, holeTyped(el));
    scheduleDraft();
  });
  vis.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      grade();
      return;
    }
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const i = state.fields.findIndex(f => f.el === el);
      const next = state.fields[i + 1];
      if (next) next.el.querySelector(".vis").focus();
    }
  });
  pad.addEventListener("pointerdown", e => {
    e.preventDefault();
    vis.focus();
    const sel = window.getSelection();
    if (!sel) return;
    const range = document.createRange();
    range.selectNodeContents(vis);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  });
  return el;
}
function appendEgovHead(sheet, article) {
  if (article.caption) {
    const cap = document.createElement("div");
    cap.className = "egov-cap";
    cap.textContent = "（" + article.caption + "）";
    sheet.append(cap);
  }
  const no = document.createElement("span");
  no.className = "egov-no";
  no.textContent = article.label + "　";
  sheet.append(no);
}
function grade() {
  if (!state.fields.length) return;
  let ok = 0;
  const misses = [];
  for (const f of state.fields) {
    const good = canon(holeTyped(f.el)) === canon(f.answer);
    f.el.classList.toggle("good", good);
    f.el.classList.toggle("bad", !good);
    if (good) ok++;
    else misses.push(f);
  }
  els.score.textContent = "一致 " + ok + " / " + state.fields.length;
  els.misses.replaceChildren();
  if (!misses.length) {
    const p = document.createElement("p");
    p.className = "ok";
    p.textContent = "すべて一致しました。";
    els.misses.append(p);
    return;
  }
  for (const f of misses.slice(0, 30)) {
    const row = document.createElement("div");
    row.className = "row";
    row.append(label("条文 "), colored(f.answer, holeTyped(f.el), "answer"), document.createElement("br"), label("入力 "), colored(holeTyped(f.el), f.answer, "input"));
    els.misses.append(row);
  }
  if (misses.length > 30) {
    const more = document.createElement("p");
    more.textContent = "ほか " + (misses.length - 30) + "箇所が不一致です。欄の色で分かります。";
    els.misses.append(more);
  }
}
function label(text) {
  const s = document.createElement("span");
  s.className = "label";
  s.textContent = text;
  return s;
}
function colored(raw, other, role) {
  const wrap = document.createDocumentFragment();
  const answer = role === "answer" ? raw : other;
  const given = role === "answer" ? other : raw;
  const a = canonIndex(answer);
  const b = canonIndex(given);
  const ops = diffOps(a.canonText, b.canonText);
  const mine = role === "answer" ? a : b;
  if (!ops) {
    wrap.append(document.createTextNode(raw));
    return wrap;
  }
  const mark = new Array(mine.canonText.length).fill(false);
  let ia = 0;
  let ib = 0;
  for (const op of ops) {
    if (op[0] === "eq") { ia++; ib++; }
    else if (op[0] === "del") { if (role === "answer") mark[ia] = true; ia++; }
    else { if (role === "input") mark[ib] = true; ib++; }
  }
  const flagged = new Set(mine.raw.filter((_, k) => mark[k]));
  let buf = "";
  let on = false;
  const flush = () => {
    if (!buf) return;
    if (on) {
      const s = document.createElement("span");
      s.className = role === "answer" ? "miss" : "extra";
      s.textContent = buf;
      wrap.append(s);
    } else wrap.append(document.createTextNode(buf));
    buf = "";
  };
  for (let i = 0; i < raw.length; i++) {
    const next = flagged.has(i);
    if (next !== on) { flush(); on = next; }
    buf += raw[i];
  }
  flush();
  return wrap;
}
function canonIndex(s) {
  const raw = [];
  let canonText = "";
  for (let i = 0; i < s.length; i++) {
    const c = canon(s[i]);
    if (!c) continue;
    canonText += c;
    raw.push(i);
  }
  return { canonText, raw };
}
function diffOps(a, b) {
  const n = a.length;
  const m = b.length;
  if (n * m > 8000) return null;
  const dp = new Uint16Array((n + 1) * (m + 1));
  const ix = (i, j) => i * (m + 1) + j;
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      dp[ix(i, j)] = a[i - 1] === b[j - 1]
        ? dp[ix(i - 1, j - 1)] + 1
        : Math.max(dp[ix(i - 1, j)], dp[ix(i, j - 1)]);
    }
  }
  const ops = [];
  let i = n;
  let j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) { ops.push(["eq", a[i - 1]]); i--; j--; }
    else if (j > 0 && (i === 0 || dp[ix(i, j - 1)] >= dp[ix(i - 1, j)])) { ops.push(["ins", b[j - 1]]); j--; }
    else { ops.push(["del", a[i - 1]]); i--; }
  }
  ops.reverse();
  return ops;
}
function showInput() {
  if (!state.answer) return;
  state.answer = false;
  const shown = els.work.querySelector(".answer-sheet");
  if (shown) shown.remove();
  const sheet = els.work.querySelector(".sheet");
  if (sheet) sheet.hidden = false;
  syncTools();
}
function reveal() {
  if (!state.article || state.answer) return;
  for (const f of state.fields) f.el.querySelector(".vis").blur();
  const sheet = els.work.querySelector(".sheet");
  if (sheet) sheet.hidden = true;
  const answer = document.createElement("div");
  answer.className = "sheet answer-sheet";
  appendStatute(answer, "answer");
  els.work.append(answer);
  state.answer = true;
  syncTools();
}
function resetFields() {
  for (const f of state.fields) {
    setHoleTyped(f.el, "");
    f.el.classList.remove("good", "bad");
  }
  els.score.textContent = "";
  els.misses.replaceChildren();
  const all = JSON.parse(sessionStorage.getItem(STORE) || "{}");
  delete all[draftSlot()];
  sessionStorage.setItem(STORE, JSON.stringify(all));
  showInput();
}
document.getElementById("levels").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  saveDraft();
  state.level = btn.dataset.level;
  renderLevels();
  renderWork();
  saveStore({ last: Object.assign(loadStore().last || {}, { level: state.level }) });
});
document.getElementById("inputMode").addEventListener("click", showInput);
document.getElementById("grade").addEventListener("click", grade);
document.getElementById("reveal").addEventListener("click", reveal);
document.getElementById("reset").addEventListener("click", resetFields);
document.getElementById("menu").addEventListener("click", () => {
  if (document.body.classList.contains("nav-open")) closeNav();
  else openNav();
});
document.getElementById("navclose").addEventListener("click", closeNav);
document.getElementById("backdrop").addEventListener("click", closeNav);
els.suppl.addEventListener("change", () => { renderList(); });
els.q.addEventListener("input", () => renderList());

(function init() {
  const last = loadStore().last || {};
  state.kind = last.kind || "法";
  state.level = LEVELS.includes(last.level) ? last.level : "core";
  els.suppl.checked = !!last.suppl;
  let law = laws.find(l => l.kind === state.kind) || laws[0];
  let article = law.articles.find(a => a.division === "本則") || law.articles[0];
  if (last.key) {
    const [kind, division, id] = last.key.split("\t");
    const foundLaw = laws.find(l => l.kind === kind);
    const found = foundLaw && foundLaw.articles.find(a => a.division === division && a.article === id);
    if (found) { law = foundLaw; article = found; }
  }
  openArticle(law, article);
})();
</script>
